services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: squash
      POSTGRES_USER: squash
      POSTGRES_PASSWORD: squash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U squash -d squash"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://squash:squash@db:5432/squash
      JWT_SECRET: change-me-in-production
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
